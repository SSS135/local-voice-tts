buildscript {
    configurations.classpath.resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-gradle-plugin') && details.requested.version == '2.2.10') details.useVersion('2.3.21')
    }
}
plugins { id 'com.android.application' version '9.2.0' apply false }
