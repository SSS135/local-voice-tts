plugins { id 'com.android.application' }
def localStorePath = System.getenv('LOCAL_VOICE_KEYSTORE')
def localStore = localStorePath ? file(localStorePath) : rootProject.file('signing/local-voice.keystore')
def localStorePassword = System.getenv('LOCAL_VOICE_STORE_PASSWORD')
def useLocalSigning = localStore.isFile() && localStorePassword != null && !localStorePassword.isEmpty()
if (localStorePath && !localStore.isFile()) throw new GradleException('LOCAL_VOICE_KEYSTORE does not name an existing file')
android {
    namespace 'org.localvoice.tts'
    compileSdk 36
    defaultConfig { applicationId 'org.localvoice.tts'; minSdk 26; targetSdk 36; versionCode 4; versionName '1.2.0'; testInstrumentationRunner 'org.localvoice.tts.PatchAcceptanceInstrumentation'; ndk { abiFilters 'arm64-v8a','x86_64' } }
    signingConfigs {
        if (useLocalSigning) {
            local {
                storeFile localStore
                storePassword localStorePassword
                keyAlias System.getenv('LOCAL_VOICE_KEY_ALIAS') ?: 'localvoice'
                keyPassword System.getenv('LOCAL_VOICE_KEY_PASSWORD') ?: localStorePassword
            }
        }
    }
    buildTypes {
        // Only release gets the private key; debuggable debug builds keep the Android debug key (SEC-002).
        release { if (useLocalSigning) signingConfig signingConfigs.local; minifyEnabled false }
    }
    // libneutts_jni.so (NeuTTS backend) from pinned llama.cpp/eSpeak NG sources; see app/src/main/cpp/CMakeLists.txt.
    ndkVersion '29.0.14206865'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    defaultConfig { externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release' } } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging false } }
    // One JVM per check class: checks mutate statics such as Catalog.MODELS.
    testOptions { unitTests.all { forkEvery = 1 } }
}
dependencies {
    implementation files('libs/sherpa-onnx-1.13.8.aar'); implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'; implementation 'com.squareup.okhttp3:okhttp:5.4.0'; constraints { implementation('androidx.tracing:tracing:1.2.0') }
    testImplementation 'junit:junit:4.13.2'
    // Android's own org.json implementation; the android.jar stub throws in local unit tests.
    testImplementation 'com.vaadin.external.google:android-json:0.0.20131108.vaadin1'
}

