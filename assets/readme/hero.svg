  <title id="title">Local Voice</title>
  <desc id="desc">Android system text-to-speech engine. Neural English and Russian voices for every app that reads aloud, computed on the phone. Illustration: the engine's own sample sentences with the current word highlighted from rangeStart word marks above the audio waveform.</desc>
