    <text x="64" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#EFF4FA">Neural voices for every app that reads aloud,</text>
    <text x="64" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#EFF4FA">computed on the phone itself.</text>
